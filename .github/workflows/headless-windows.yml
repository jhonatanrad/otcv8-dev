name: Build Headless Windows
on:
  workflow_dispatch:
  push:
    branches: [headless-v1]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - name: Install maintained pkg-config tool
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-pkgconf
      - name: Restore compiled dependency cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/otcv8-binary-cache
          key: otcv8-vcpkg-2022-x86-v143-${{ github.run_id }}
          restore-keys: |
            otcv8-vcpkg-2022-x86-v143-
      - name: Install pinned upstream dependencies
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          VCPKG_KEEP_ENV_VARS: PKG_CONFIG
        run: |
          $env:PKG_CONFIG = Join-Path $env:MSYS2_LOCATION "ucrt64/bin/pkgconf.exe"
          if (-not (Test-Path $env:PKG_CONFIG)) { throw "Maintained pkgconf executable not found" }
          & $env:PKG_CONFIG --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cache = Join-Path $env:RUNNER_TEMP "otcv8-binary-cache"
          New-Item -ItemType Directory -Force $cache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$cache,readwrite"
          $root = Join-Path $env:RUNNER_TEMP "vcpkg-otcv8"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $root checkout 3b3bd424827a1f7f4813216f6b32b6c61e386b2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The historical 7-Zip URL has been removed. Seed the original archive
          # from the upstream project's SourceForge mirror with integrity checking.
          $downloads = Join-Path $root "downloads"
          New-Item -ItemType Directory -Force $downloads | Out-Null
          $archive = Join-Path $downloads "7z2107-extra.7z"
          $url = "https://downloads.sourceforge.net/project/sevenzip/7-Zip/21.07/7z2107-extra.7z"
          curl.exe --fail --location --retry 3 --output $archive $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = "362411800adf3af0170c1cd443120f072774b784f21ecf9edb5843645c53c94b"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw "7-Zip archive integrity check failed"
          }
          # LuaJIT removed its historical GitHub release tag. Use the original
          # 2.0.5 release archive, with the independently recorded SHA512.
          $luaPort = Join-Path $root "ports/luajit/portfile.cmake"
          $lua = Get-Content $luaPort -Raw
          $oldBlock = '(?s)^vcpkg_from_github\(.*?\r?\n\)'
          if (-not [regex]::IsMatch($lua, $oldBlock)) { throw "Unexpected LuaJIT port format" }
          $newBlock = @'
          vcpkg_download_distfile(ARCHIVE
              URLS "https://fra.de.distfiles.macports.org/luajit/LuaJIT-2.0.5.tar.gz"
                   "https://macports.distfiles.ionic.de/luajit/LuaJIT-2.0.5.tar.gz"
              FILENAME "LuaJIT-2.0.5.tar.gz"
              SHA512 2636675602b4a060b0571c05220db2061dd2f38568e35b2be346a0f5e3128d87057d11d3d0d7567d8cc4e0817b5e4cf2c52a17a48065520962b157816465a9fe
          )
          vcpkg_extract_source_archive_ex(
              OUT_SOURCE_PATH SOURCE_PATH
              ARCHIVE ${ARCHIVE}
              REF 2.0.5
              PATCHES 001-fix-build-path.patch 002-fix-crt-linkage.patch
          )
          '@
          $lua = [regex]::Replace($lua, $oldBlock, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $newBlock })
          Set-Content $luaPort $lua -Encoding utf8NoBOM
          # Keep the pinned OpenSSL ABI but add the official archive host.
          $sslPort = Join-Path $root "ports/openssl/portfile.cmake"
          $ssl = Get-Content $sslPort -Raw
          $ssl = $ssl.Replace('URLS "https://www.openssl.org/source/', 'URLS "https://mirror.openssl-library.org/source/old/1.1.1/openssl-${OPENSSL_VERSION}.tar.gz" "https://www.openssl.org/source/')
          Set-Content $sslPort $ssl -Encoding utf8NoBOM
          # Legacy CMake projects need an explicit policy compatibility floor.
          foreach ($port in @("openal-soft", "physfs")) {
            $portfile = Join-Path $root "ports/$port/portfile.cmake"
            $body = Get-Content $portfile -Raw
            $pattern = '(?m)^([ \t]*)OPTIONS[ \t]*\r?$'
            if (-not [regex]::IsMatch($body, $pattern)) { throw "Missing CMake OPTIONS in $port" }
            $body = [regex]::Replace($body, $pattern, [System.Text.RegularExpressions.MatchEvaluator]{
              param($m) $m.Groups[1].Value + "OPTIONS" + [Environment]::NewLine + "        -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
            })
            Set-Content $portfile $body -Encoding utf8NoBOM
          }
          cmake --version
          $ports = @("boost-iostreams","boost-asio","boost-beast","boost-system","boost-variant","boost-lockfree","boost-process","boost-program-options","boost-uuid","boost-filesystem","luajit","glew","physfs","openal-soft","libogg","libvorbis","zlib","libzip","bzip2","openssl","liblzma")
          & "$root\vcpkg.exe" install --triplet x86-windows-static @ports
          $installExit = $LASTEXITCODE
          if ($installExit -ne 0) {
            foreach ($port in @("openal-soft", "physfs", "openssl")) {
              $logs = Join-Path $root "buildtrees/$port"
              if (Test-Path $logs) {
                Get-ChildItem $logs -Filter "*.log" -File | ForEach-Object {
                  Write-Host "::group::$($_.Name)"
                  Get-Content $_.FullName -Tail 100
                  Write-Host "::endgroup::"
                }
              }
            }
            exit $installExit
          }
          & "$root\vcpkg.exe" integrate install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save dependency cache even if installation failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/otcv8-binary-cache
          key: otcv8-vcpkg-2022-x86-v143-${{ github.run_id }}
      - name: Compile Windows prototype
        shell: pwsh
        run: |
          MSBuild.exe vc16/otclient.vcxproj /m /p:Configuration=OpenGL /p:Platform=Win32 /p:PlatformToolset=v143 /p:BUILD_REVISION=${{ github.run_number }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item otclient_gl.exe otclient_headless.exe
      - name: Offline no-render smoke test
        timeout-minutes: 2
        shell: pwsh
        run: |
          $p = Start-Process .\otclient_headless.exe -ArgumentList "--headless-smoke" -PassThru -Wait
          Get-ChildItem *.log | ForEach-Object { Get-Content $_.FullName -Tail 100 }
          if ($p.ExitCode -ne 0) { throw "Smoke test exit code: $($p.ExitCode)" }
          if (-not (Get-ChildItem *.log | Select-String "SMOKE_OK")) { throw "Missing smoke test confirmation" }
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-logs
          path: |
            *.log
            ${{ runner.temp }}/vcpkg-otcv8/buildtrees/*/*.log
          if-no-files-found: ignore
      - name: Package prototype
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force headless-dist | Out-Null
          Copy-Item otclient_headless.exe,init.lua,headless.lua,headless-smoke.lua,headless-local.example.lua,start-headless.cmd,test-headless.cmd,HEADLESS.md,LICENSE headless-dist
          Copy-Item modules headless-dist/modules -Recurse
          New-Item -ItemType Directory -Force headless-dist/data/things/860 | Out-Null
      - name: Upload Windows prototype
        uses: actions/upload-artifact@v4
        with:
          name: OTCv8-Headless-Windows
          path: headless-dist/
          if-no-files-found: error
